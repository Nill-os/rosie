plugins { id 'com.android.application' }
android {
    namespace 'app.rosie.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'app.rosie.assistant'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '1.18'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }   // personal sideloaded app: signed with the local debug key
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
